<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Full Player</title>
    <style>
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        
        #myIframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        id="myIframe" 
        src="" 
        allow="autoplay; fullscreen" 
        allowfullscreen>
    </iframe>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');

        
        if (videoUrl) {
            document.getElementById('myIframe').src = videoUrl;
        } else {
            
            document.getElementById('myIframe').src = "https";
        }
    </script>

</body>
</html>
