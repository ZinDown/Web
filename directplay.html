<html lang="en">
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Dynamic Fullscreen Player</title> 
  <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #videoPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain; 
        }
    </style> 
 </head> 
 <body> 
  <video id="videoPlayer" controls="" autoplay="" preload="auto" poster="${encodeURIComponent(img)"> 
   <source id="videoSource" src="${encodeURIComponent(link)}" type="video/mp4"> Your browser does not support the video tag. 
  </video> 
  <script>
   
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const posterUrl = urlParams.get('img'); // 'img' parameter ကို ဖတ်ယူခြင်း

        const player = document.getElementById('videoPlayer');
        const source = document.getElementById('videoSource');

   
        if (videoUrl) {
            source.src = videoUrl;
        } else {
       
            source.src = "https://drkogyi.vip/wp-content/uploads/2026/01/26jan241.mp4";
        }


        if (posterUrl) {
            player.poster = posterUrl;
        } else {
        
            player.poster = "https://drkogyi.vip/wp-content/uploads/2025/03/2521mar6.png";
        }


        player.load();
    </script> 
 </body>
</html>
