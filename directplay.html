<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Speed Buffer Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        :root { --plyr-color-main: #2196F3; }
        .plyr { height: 100vh; width: 100%; }
        video { height: 100vh !important; width: 100% !important; object-fit: contain; }
    </style>
</head>
<body>

    <div class="container">
        <video id="player" playsinline controls preload="auto">
            <source id="videoSource" type="video/mp4" />
        </video>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url') || "https://drkogyi.vip/wp-content/uploads/2026/01/26jan271.mp4";
        const posterUrl = urlParams.get('img') || "https://img.mmporns.com/2627jan1.png";

        const videoElement = document.getElementById('player');
        const sourceElement = document.getElementById('videoSource');
        
        sourceElement.src = videoUrl;
        videoElement.poster = posterUrl;

        // Player Initial
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
            settings: ['speed'],
            speed: { selected: 1, options: [0.5, 1, 1.25, 1.5, 2] }
        });

        // --- Speed & Buffering Optimization ---

        player.on('ready', () => {
     
            videoElement.setAttribute('preload', 'auto');
            videoElement.setAttribute('autobuffer', 'true');


            const boostBuffer = () => {
                if (videoElement.buffered.length > 0) {
                    const bufferedEnd = videoElement.buffered.end(videoElement.buffered.length - 1);
                    const duration = videoElement.duration;
                    

                    if (bufferedEnd < duration) {
                        videoElement.play().then(() => {
                    
                            if (videoElement.paused === false && videoElement.currentTime < 0.1) {
                                videoElement.pause();
                            }
                        }).catch(e => {});
                    }
                }
            };

      
            videoElement.addEventListener('loadedmetadata', function() {
                console.log("Metadata Loaded: Optimizing Buffer Speed...");
                videoElement.preload = "auto";
                boostBuffer();
            });

    
            videoElement.addEventListener('progress', boostBuffer);
        });

    
        player.on('error', () => {
            console.log("Network lag detected. Re-connecting...");
            videoElement.load();
        });

    </script>
</body>
</html>
